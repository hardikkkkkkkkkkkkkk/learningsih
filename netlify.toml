[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

# Bundle @google/genai into the Netlify function instead of leaving it external.

[[redirects]]
  from = "/api/chat"
  to = "/.netlify/functions/chat"
  status = 200
  force = true

[[redirects]]
  from = "/api/gemini-health"
  to = "/.netlify/functions/gemini-health"
  status = 200
  force = true

# SPA fallback — keep this LAST, after the /api redirects above.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
